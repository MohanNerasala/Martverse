spring:
  datasource:
    url: jdbc:h2:mem:martversetest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  sql:
    init:
      mode: never

app:
  jwt:
    secret: myTestSecretKeyThatIsAtLeast256BitsLongForHS256AlgorithmMartverseTest
    access-token-expiration-ms: 3600000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: "*"
  payment:
    mode: DEMO_SIMULATION
    simulated: true
    test-mode-enabled: true
