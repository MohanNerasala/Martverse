<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <!-- Packaging Box Outer -->
  <rect x="20" y="20" width="360" height="460" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>
  <rect x="35" y="35" width="330" height="70" rx="14" fill="url(#accentGrad)"/>
  <text x="200" y="78" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">MARTVERSE</text>
  
  <!-- Product Silhouette Icon -->
  <circle cx="200" cy="220" r="70" fill="#1e293b" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6,4"/>
  <path d="M170 240 L200 180 L230 240 Z" fill="#38bdf8" opacity="0.8"/>
  <rect x="185" y="240" width="30" height="25" rx="4" fill="#0284c7"/>

  <!-- Content Details -->
  <text x="200" y="330" font-family="system-ui, sans-serif" font-weight="800" font-size="20" fill="#f8fafc" text-anchor="middle">SUPERMARKET PRODUCT</text>
  <text x="200" y="360" font-family="system-ui, sans-serif" font-weight="600" font-size="14" fill="#94a3b8" text-anchor="middle">Quality Verified • 100% Genuine</text>

